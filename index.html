            var splash = document.getElementById('splash-loader');
            var status = document.getElementById('splash-status');
            var retry = document.getElementById('splash-retry');
            var waiting = setTimeout(function () {
                status.textContent = '下载较慢，仍在加载。也可以重新加载页面。';
                retry.hidden = false;
            }, 15000);

            retry.addEventListener('click', function () { window.location.reload(); });
            function failed(event) {
                // Image failures must never prevent the game from opening.
                if (event.type === 'error' && event.target !== window && event.target.tagName !== 'SCRIPT') return;
                clearTimeout(waiting);
                splash.setAttribute('data-state', 'error');
                splash.setAttribute('aria-busy', 'false');
                status.textContent = '游戏未能加载，请重新加载。已有存档不会删除。';
                retry.hidden = false;
            }
            function ready() {
                clearTimeout(waiting);
                window.removeEventListener('error', failed, true);
                window.removeEventListener('unhandledrejection', failed);
                window.removeEventListener('chengame:ready', ready);
                splash.remove();
            }
            window.addEventListener('error', failed, true);
            window.addEventListener('unhandledrejection', failed);
            window.addEventListener('chengame:ready', ready);
        }());</script></body></html>
